# More option see https://github.com/DreamMaoMao/mango/wiki/

# Monitors
monitorrule=name:^DP-1$,width:3840,height:2160,refresh:60,x:0,y:0,scale:1.25
monitorrule=name:^eDP-1$,width:1920,height:1080,refresh:60,x:3072,y:0

# Window effect
focused_opacity=1.0
unfocused_opacity=1.0

animations=0

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout setting
new_is_master=1
default_mfact=0.60
default_nmaster=1
smartgaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview Setting
hotarea_size=10
enable_hotarea=1
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us,ru
xkb_rules_options=caps:none
bind=NONE,code:66,spawn,sh -c 'mmsg -s -d switch_keyboard_layout; pkill -RTMIN+10 waybar'

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=5
gappiv=5
gappoh=5
gappov=5
# scratchpad_width_ratio=0.8
# scratchpad_height_ratio=0.9
borderpx=3
rootcolor=0x201b14ff
bordercolor=0x444444ff
dropcolor=0x8FBA7C55
splitcolor=0xEB441EFF
focuscolor=0x93a1a1ff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c9400
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER+SHIFT,r,reload_config

# menu and terminal
bind=SUPER,p,spawn,rofi -show drun
bind=SUPER,Return,spawn,foot

# other apps
bind=SUPER,b,spawn,helium-browser

# exit
bind=SUPER+SHIFT,e,quit
bind=SUPER,w,killclient,

# switch window focus
bind=SUPER,j,focusstack,next
bind=SUPER,k,focusstack,prev

# swap window
bind=SUPER+SHIFT,l,exchange_stack_client,next
bind=SUPER+SHIFT,h,exchange_stack_client,prev
bind=SUPER,z,zoom

# switch window status
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,toggleoverview,
bind=SUPER,space,togglefloating,
bind=SUPER,f,togglefullscreen,
# bind=ALT+SHIFT,f,togglefakefullscreen,
# bind=SUPER,i,minimized,
# bind=SUPER,o,toggleoverlay,
# bind=SUPER+SHIFT,I,restore_minimized
# bind=ALT,z,toggle_scratchpad

# scroller layout
# bind=ALT,e,set_proportion,1.0
# bind=ALT,x,switch_proportion_preset,
# bind=alt+super+ctrl,left,scroller_stack,left
# bind=alt+super+ctrl,right,scroller_stack,right
# bind=alt+super+ctrl,up,scroller_stack,up
# bind=alt+super+ctrl,down,scroller_stack,down

#dwindle layout(manual split mode)
# bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
bind=SUPER,n,switch_layout

# tag switch
# bind=SUPER,Left,viewtoleft,0
# bind=CTRL,Left,viewtoleft_have_client,0
# bind=SUPER,Right,viewtoright,0
# bind=CTRL,Right,viewtoright_have_client,0
# bind=CTRL+SUPER,Left,tagtoleft,0
# bind=CTRL+SUPER,Right,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SUPER+SHIFT,1,tagsilent,1,0
bind=SUPER+SHIFT,2,tagsilent,2,0
bind=SUPER+SHIFT,3,tagsilent,3,0
bind=SUPER+SHIFT,4,tagsilent,4,0
bind=SUPER+SHIFT,5,tagsilent,5,0
bind=SUPER+SHIFT,6,tagsilent,6,0
bind=SUPER+SHIFT,7,tagsilent,7,0
bind=SUPER+SHIFT,8,tagsilent,8,0
bind=SUPER+SHIFT,9,tagsilent,9,0

bind=SUPER+SHIFT+CTRL,1,toggletag,1
bind=SUPER+SHIFT+CTRL,2,toggletag,2
bind=SUPER+SHIFT+CTRL,3,toggletag,3
bind=SUPER+SHIFT+CTRL,4,toggletag,4
bind=SUPER+SHIFT+CTRL,5,toggletag,5
bind=SUPER+SHIFT+CTRL,6,toggletag,6
bind=SUPER+SHIFT+CTRL,7,toggletag,7
bind=SUPER+SHIFT+CTRL,8,toggletag,8
bind=SUPER+SHIFT+CTRL,9,toggletag,9

bind=SUPER+CTRL,1,toggleview,1
bind=SUPER+CTRL,2,toggleview,2
bind=SUPER+CTRL,4,toggleview,3
bind=SUPER+CTRL,5,toggleview,4
bind=SUPER+CTRL,5,toggleview,5
bind=SUPER+CTRL,6,toggleview,6
bind=SUPER+CTRL,7,toggleview,7
bind=SUPER+CTRL,8,toggleview,8
bind=SUPER+CTRL,9,toggleview,9

# monitor switch
bind=SUPER,period,focusmon,left
bind=SUPER+SHIFT,period,tagmon,left

# gaps
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=SUPER+SHIFT,Up,movewin,+0,-50
bind=SUPER+SHIFT,Down,movewin,+0,+50
bind=SUPER+SHIFT,Left,movewin,-50,+0
bind=SUPER+SHIFT,Right,movewin,+50,+0

# resizewin
bind=SUPER+ALT,Up,resizewin,+0,-50
bind=SUPER+ALT,Down,resizewin,+0,+50
bind=SUPER+ALT,Left,resizewin,-50,+0
bind=SUPER+ALT,Right,resizewin,+50,+0
bind=SUPER,h,resizewin,-50,+0
bind=SUPER,l,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
# mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Media keys
bind=NONE,XF86AudioRaiseVolume,spawn,sh $HOME/.config/river/volume-notify up
bind=NONE,XF86AudioLowerVolume,spawn,sh $HOME/.config/river/volume-notify down
bind=NONE,XF86AudioMute,spawn,sh $HOME/.config/river/volume-notify toggle
bind=NONE,XF86MonBrightnessUp,spawn,sh $HOME/.config/river/brightness-notify up
bind=NONE,XF86MonBrightnessDown,spawn,sh $HOME/.config/river/brightness-notify down

exec-once=blueman-applet
exec-once=awww-daemon
exec-once=awww img ~/Pictures/mit_bg.jpg
exec=killall waybar; waybar
