set -s escape-time 0

set -g base-index 1
setw -g pane-base-index 1
set -s extended-keys always
set -s extended-keys-format xterm

set -s user-keys[0] "\e[5;30012~"
set -s user-keys[1] "\e[6;30012~"
set -s user-keys[2] "\e[7;30012~"
set -s user-keys[3] "\e[8;30012~"

set -g default-terminal "tmux-256color"
set -g terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title:RGB:usstyle:extkeys,screen*:title,rxvt*:ignorefkeys,foot*:RGB:usstyle:extkeys'


unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1

bind-key -n F1  run-shell 'tmux select-window -t :1  2>/dev/null || tmux new-window -c "#{pane_current_path}" -t :1'
bind-key -n F2  run-shell 'tmux select-window -t :2  2>/dev/null || tmux new-window -c "#{pane_current_path}" -t :2'
bind-key -n F3  run-shell 'tmux select-window -t :3  2>/dev/null || tmux new-window -c "#{pane_current_path}" -t :3'
bind-key -n F4  run-shell 'tmux select-window -t :4  2>/dev/null || tmux new-window -c "#{pane_current_path}" -t :4'
bind-key -n F5  run-shell 'tmux select-window -t :5  2>/dev/null || tmux new-window -c "#{pane_current_path}" -t :5'
bind-key -n F6  run-shell 'tmux select-window -t :6  2>/dev/null || tmux new-window -c "#{pane_current_path}" -t :6'
bind-key -n F7  run-shell 'tmux select-window -t :7  2>/dev/null || tmux new-window -c "#{pane_current_path}" -t :7'
bind-key -n F8  run-shell 'tmux select-window -t :8  2>/dev/null || tmux new-window -c "#{pane_current_path}" -t :8'
bind-key -n F9  run-shell 'tmux select-window -t :9  2>/dev/null || tmux new-window -c "#{pane_current_path}" -t :9'
bind-key -n F10 run-shell 'tmux select-window -t :0  2>/dev/null || tmux new-window -c "#{pane_current_path}" -t :0'

# Kitty-like hotkeys
#C+S+t
bind-key -n User2 new-window -c "#{pane_current_path}"
#C+S+w
bind-key -n User3 kill-pane
#C+tab
bind-key -n User0 next-window
#C+S+tab
bind-key -n User1 previous-window

set -g mouse on
set -g status-interval 30

set -s set-clipboard on

set -g @plugin 'tmux-plugins/tpm' # must be the first plugin
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'tmux-plugins/tmux-battery'

set -g @plugin 'omerxx/tmux-sessionx' # default keybind "<prefix> O" to activate
set -g @plugin "tmux-plugins/tmux-resurrect" #persist tmux sessions after computer restart
set -g @plugin "tmux-plugins/tmux-continuum" #automatically save sessions every 15mins

set -g @plugin 'catppuccin/tmux'

set -g status-position bottom
set -g status-justify "absolute-centre"
set -g @catppuccin_status_background "none"

set -g status-right ""
set -ga status-right "BAT #{battery_percentage} "

set -wg automatic-rename on
set -g set-titles on
set -g set-titles-string '[#S:#I] #T'
set -g automatic-rename-format "#{pane_current_command}"

run '~/.tmux/plugins/tpm/tpm'
